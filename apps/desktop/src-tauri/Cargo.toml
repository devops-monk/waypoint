[package]
name = "waypoint-desktop"
description = "Waypoint desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "waypoint_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
waypoint-core.workspace = true
waypoint-sources.workspace = true
waypoint-ai.workspace = true
waypoint-docs.workspace = true
anyhow.workspace = true
chrono.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native-sync-persistent", "crypto-rust"] }
window-vibrancy = "0.6"
pdf-extract = "0.9"
tauri-plugin-notification = "=2.5.1"
