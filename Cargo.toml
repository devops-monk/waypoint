[workspace]
resolver = "3"
members = ["crates/core", "crates/sources", "crates/ai", "crates/docs", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
waypoint-core = { path = "crates/core" }
waypoint-sources = { path = "crates/sources" }
waypoint-ai = { path = "crates/ai" }
waypoint-docs = { path = "crates/docs" }

anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1_smol = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate", "chrono", "json"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
unicode-normalization = "0.1"
unicode-script = "0.5"
url = "2"
